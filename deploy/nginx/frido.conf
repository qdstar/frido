# Frido Nginx 反向代理 - 放到 /etc/nginx/sites-available/frido.conf
# sudo ln -sf /etc/nginx/sites-available/frido.conf /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name 192.144.232.160;

    # xiaozhi 智控台
    location /xiaozhi/ {
        proxy_pass http://127.0.0.1:8002/xiaozhi/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # xiaozhi WebSocket
    location /xiaozhi/v1/ {
        proxy_pass http://127.0.0.1:8000/xiaozhi/v1/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # xiaozhi 视觉 API
    location /vision/ {
        proxy_pass http://127.0.0.1:8003/mcp/vision/;
        proxy_set_header Host $host;
        client_max_body_size 10m;
    }

    # Frido 冰箱业务 API
    location /frido-api/ {
        proxy_pass http://127.0.0.1:8010/;
        proxy_set_header Host $host;
        client_max_body_size 10m;
    }
}
